name: Terraform Apply (manual)

# Runs only when triggered manually, after Azure OIDC secrets are configured.
# See the "Configure OIDC" section in the README.

on:
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC authentication with Azure
  contents: read

jobs:
  apply:
    name: Apply infrastructure
    runs-on: ubuntu-latest
    environment: dev # gate deployments with GitHub environment protection rules
    defaults:
      run:
        working-directory: ./terraform
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure credentials
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$ARM_TENANT_ID" ] || [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "::error::Azure OIDC secrets are not configured. See the README (Configure OIDC)."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
